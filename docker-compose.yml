name: bsbe-placement-portal

services:
  mongo:
    image: mongo:8.0.28-noble
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - portal-backend

  mongo-init:
    image: mongo:8.0.28-noble
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./infra/mongodb/init-replica-set.js:/scripts/init-replica-set.js:ro
    entrypoint:
      - mongosh
      - mongodb://mongo:27017/admin
      - --quiet
      - --file
      - /scripts/init-replica-set.js
    networks:
      - portal-backend

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: '500'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'false'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    volumes:
      - mailpit-data:/data
    networks:
      - portal-backend

  api:
    profiles: ['application']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      PUBLIC_ORIGIN: http://localhost:4173
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      TRUST_PROXY: 'false'
      DATABASE_ENABLED: 'true'
      MONGODB_URI: mongodb://mongo:27017/bsbe_portal?replicaSet=rs0
      OPENAPI_ENABLED: 'true'
      LOG_LEVEL: log
      INSTITUTE_EMAIL_DOMAIN: ${INSTITUTE_EMAIL_DOMAIN:?required}
      DISPLAY_TIMEZONE: Asia/Kolkata
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      SMTP_FROM: ${SMTP_FROM:?required}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAILPIT_UI_URL: http://localhost:8025
      OBJECT_STORAGE_PROVIDER: <object-storage-provider>
      OTP_PEPPER: ${OTP_PEPPER:?required}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_MAX_VERIFY_ATTEMPTS: ${OTP_MAX_VERIFY_ATTEMPTS:-5}
      OTP_LOCKOUT_SECONDS: ${OTP_LOCKOUT_SECONDS:-900}
      OTP_REQUEST_COOLDOWN_SECONDS: ${OTP_REQUEST_COOLDOWN_SECONDS:-60}
      OTP_RATE_WINDOW_SECONDS: ${OTP_RATE_WINDOW_SECONDS:-900}
      OTP_MAX_REQUESTS_PER_EMAIL: ${OTP_MAX_REQUESTS_PER_EMAIL:-5}
      OTP_MAX_REQUESTS_PER_IP: ${OTP_MAX_REQUESTS_PER_IP:-20}
      SESSION_TOKEN_PEPPER: ${SESSION_TOKEN_PEPPER:?required}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-bsbe_session}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-3600}
      SESSION_ABSOLUTE_TTL_SECONDS: ${SESSION_ABSOLUTE_TTL_SECONDS:-43200}
      STUDENT_CONCURRENT_LOGIN_POLICY: ${STUDENT_CONCURRENT_LOGIN_POLICY:-replace}
      RECENT_AUTH_MAX_AGE_SECONDS: ${RECENT_AUTH_MAX_AGE_SECONDS:-600}
      CSRF_SECRET: ${CSRF_SECRET:?required}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-bsbe_csrf}
      IP_HASH_KEY: ${IP_HASH_KEY:?required}
      QUESTION_RUBRIC_KEYS_JSON: ${QUESTION_RUBRIC_KEYS_JSON:?required}
      QUESTION_RUBRIC_ACTIVE_KEY_VERSION: ${QUESTION_RUBRIC_ACTIVE_KEY_VERSION:?required}
      MEDIA_STORAGE_DRIVER: ${MEDIA_STORAGE_DRIVER:-s3}
      MEDIA_LOCAL_ROOT: ${MEDIA_LOCAL_ROOT:-var/media}
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-5242880}
      MEDIA_MAX_PIXELS: ${MEDIA_MAX_PIXELS:-25000000}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - portal-backend

  web:
    profiles: ['application']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: http://localhost:3000/api/v1
        VITE_APP_NAME: BSBE Placement Mock Test Portal
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:4173:8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - portal-backend

volumes:
  mailpit-data:
  mongo-data:

networks:
  portal-backend:
    driver: bridge
