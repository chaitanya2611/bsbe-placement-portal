previews:
  generation: off

services:
  - type: web
    name: bsbe-placement-portal
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: API_PUBLIC_ORIGIN
        value: https://bsbe-placement-api.onrender.com

  - type: web
    name: bsbe-placement-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    dockerCommand: node --enable-source-maps dist/render-free-start.js
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: '10000'
      - key: PUBLIC_ORIGIN
        value: https://bsbe-placement-portal.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://bsbe-placement-portal.onrender.com
      - key: TRUST_PROXY
        value: 'true'
      - key: DATABASE_ENABLED
        value: 'true'
      - key: OPENAPI_ENABLED
        value: 'false'
      - key: LOG_LEVEL
        value: log
      - key: INSTITUTE_EMAIL_DOMAIN
        value: iitb.ac.in
      - key: DISPLAY_TIMEZONE
        value: Asia/Kolkata
      - key: SESSION_COOKIE_NAME
        value: bsbe_session
      - key: SESSION_IDLE_TTL_SECONDS
        value: '86400'
      - key: SESSION_ABSOLUTE_TTL_SECONDS
        value: '604800'
      - key: STUDENT_CONCURRENT_LOGIN_POLICY
        value: replace
      - key: RECENT_AUTH_MAX_AGE_SECONDS
        value: '86400'
      - key: MAILPIT_UI_URL
        value: https://mail.invalid
      - key: OBJECT_STORAGE_PROVIDER
        value: s3-compatible
      - key: MEDIA_STORAGE_DRIVER
        value: s3
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      - key: QUESTION_RUBRIC_ACTIVE_KEY_VERSION
        value: production-v1
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: walvekarchaitanya@gmail.com
      - key: BOOTSTRAP_ADMIN_NAME
        value: Initial Administrator
      - key: OTP_PEPPER
        generateValue: true
      - key: SESSION_TOKEN_PEPPER
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: IP_HASH_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: QUESTION_RUBRIC_KEYS_JSON
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
