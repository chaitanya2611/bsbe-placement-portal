name: bsbe-placement-portal-production

services:
  api:
    image: ${PORTAL_API_IMAGE:?set PORTAL_API_IMAGE to an immutable image digest}
    restart: unless-stopped
    env_file: ${PORTAL_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      DATABASE_ENABLED: 'true'
      OPENAPI_ENABLED: 'false'
      TRUST_PROXY: 'true'
      INSTITUTE_EMAIL_DOMAIN: iitb.ac.in
      DISPLAY_TIMEZONE: Asia/Kolkata
      MEDIA_STORAGE_DRIVER: s3
    expose: ['3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/tmp:size=64m,noexec,nosuid,nodev']

  web:
    image: ${PORTAL_WEB_IMAGE:?set PORTAL_WEB_IMAGE to an immutable image digest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '8080'
      API_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
    expose: ['8080']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/tmp:size=32m,noexec,nosuid,nodev']

  proxy:
    image: ${NGINX_IMAGE:?set NGINX_IMAGE to an immutable nginx image digest}
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./infra/nginx/portal.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERTIFICATE_PATH:?set TLS_CERTIFICATE_PATH}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY_PATH:?set TLS_PRIVATE_KEY_PATH}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [frontend, backend]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: ['/var/cache/nginx', '/var/run']

networks:
  frontend:
  backend:
    internal: true
